# Banco em memoria criado a cada inicializacao e descartado ao encerrar a API.
spring.datasource.url=jdbc:h2:mem:ps1ads;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Flyway cria o esquema local executando V1, V2 e V3.
spring.flyway.enabled=true

# Console opcional do banco: http://localhost:8888/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
