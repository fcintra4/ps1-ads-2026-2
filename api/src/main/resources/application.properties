spring.application.name=api

# Porta da aplicação
server.port=8080

# Paginação padrão
spring.data.web.pageable.default-page-size=3

# Configuração do banco de dados PostgreSQL (Prisma)
spring.datasource.url=jdbc:postgresql://pooled.db.prisma.io:5432/postgres?sslmode=require
spring.datasource.username=78fb942c43bafdcb553b6f5a5d8ce2c0eb49f29109a7261c7fc00ff71db1d378
spring.datasource.password=sk_r9IQhRoUXR-eaaVLx_gHM
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração Flyway (migrações)
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Timeout de conexão (evita travar startup se o banco estiver offline)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
